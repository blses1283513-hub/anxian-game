<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f1a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="暗線遊戲室">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>暗線遊戲室</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column. Public information sits on dark panels; the only light surface is the player's own secret dossier card. Single dark look by choice: played at a table, screens tilted away from neighbours. */
:root{
  color-scheme:dark;
  --ink:#0f1a22; --panel:#17262f; --panel2:#1f333e; --line:#2f4754;
  --bone:#ece4d0; --mute:#93a6ab; --amber:#e8a33d; --amber-ink:#22170a;
  --threat:#e2594c; --safe:#52b8a8; --neutral:#ab93dc; --gold:#f1cf63;
  --paper:#ece4d0; --paper-ink:#1b2126; --paper-mute:#5d655f;
  --t0:#e2594c; --t1:#5c9eea; --t2:#68ba6f;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:30px;font-weight:900;letter-spacing:.06em}
h2{font-size:19px}
h3{font-size:13px;font-family:var(--body);font-weight:700;letter-spacing:.14em;color:var(--mute)}
p{margin:0}
.sub{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{font:inherit;font-weight:700;border-radius:4px;border:1px solid var(--line);background:var(--panel2);color:var(--bone);padding:10px 14px;min-height:44px;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--amber)}
.btn:focus-visible,input:focus-visible,.st:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.danger{border-color:var(--threat);color:var(--threat);background:transparent}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;font-weight:500}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.on{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
input[type=text]{font:inherit;background:var(--ink);color:var(--bone);border:1px solid var(--line);border-radius:4px;padding:10px 12px;height:44px;box-sizing:border-box;min-width:0;width:100%}
.code{font-family:var(--mono);font-size:34px;letter-spacing:.3em;color:var(--amber);line-height:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--mono)}
.c-threat{color:var(--threat);border-color:var(--threat)} .c-safe{color:var(--safe);border-color:var(--safe)} .c-neutral{color:var(--neutral);border-color:var(--neutral)}
.gamecard{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px}
.gamecard .nm{font-family:var(--display);font-size:20px}
.gamecard .ds{font-weight:400;font-size:13px;color:var(--mute)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.strip div{background:var(--panel);padding:8px 6px;text-align:center}
.strip .k{font-size:11px;letter-spacing:.1em;color:var(--mute)}
.strip .v{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.strip .v.late{color:var(--threat)}
.dossier{background:var(--paper);color:var(--paper-ink);border-radius:3px;padding:16px;position:relative;display:flex;flex-direction:column;gap:8px;
  background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(27,33,38,.07) 27px 28px)}
.dossier .lbl{font-size:11px;letter-spacing:.18em;color:var(--paper-mute)}
.dossier .role{font-family:var(--display);font-weight:900;font-size:32px;line-height:1.1}
.dossier .stamp{position:absolute;right:14px;top:14px;transform:rotate(7deg);border:2px solid currentColor;padding:2px 8px;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;border-radius:2px}
.dossier .stamp.threat{color:#b53226} .dossier .stamp.safe{color:#1f7a6c} .dossier .stamp.neutral{color:#5f45a3}
.dossier .num{font-family:var(--mono);font-size:15px}
.dossier ul{margin:0;padding-left:18px;font-size:14px}
.dossier .btn{background:transparent;color:var(--paper-ink);border-color:var(--paper-mute)}
.hidden-card{border:1px dashed var(--line);border-radius:3px;padding:18px;text-align:center;color:var(--mute)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pl{border:1px solid var(--line);border-radius:4px;padding:6px 10px;display:flex;justify-content:space-between;gap:6px;align-items:center;min-width:0;font-size:14px}
.pl span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.dead{opacity:.55;text-decoration:line-through}
.pl.me{border-color:var(--amber)}
.pl .tag{font-size:12px;color:var(--mute);text-decoration:none;white-space:nowrap}
.log{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto;font-size:14px}
.log div{display:flex;gap:8px}
.log .r{font-family:var(--mono);color:var(--mute);font-size:12px;flex:none;padding-top:2px}
.log.secret div{color:var(--gold)}
.banner{border:1px solid var(--amber);border-radius:6px;padding:16px;text-align:center}
.banner h2{font-size:26px;color:var(--amber)}
.note{border-left:3px solid var(--amber);padding:4px 10px;color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mute);font-weight:500}
td.n{font-family:var(--mono);text-align:right}
.scroll{overflow-x:auto}
details{border:1px solid var(--line);border-radius:6px;padding:10px 14px}
summary{cursor:pointer;font-weight:700}
details ul{padding-left:18px;margin:8px 0 0;color:var(--mute);font-size:14px}
.map{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.map svg{display:block;width:100%;height:auto}
.st{cursor:pointer}
.st text{font-family:var(--body);font-size:11px;fill:var(--bone);paint-order:stroke;stroke:var(--panel);stroke-width:3px;text-anchor:middle}
.st .dot{fill:var(--ink);stroke:var(--bone);stroke-width:2}
.st.sel .dot{stroke:var(--amber);stroke-width:3.5}
.st.reach .dot{fill:var(--panel2);stroke:var(--amber)}
.st.sel text,.st.here text{fill:var(--bone);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bone);color:var(--paper-ink);padding:8px 16px;border-radius:4px;font-weight:700;max-width:90vw;z-index:20}
.panel.ask{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.cover{min-height:60vh;justify-content:center;text-align:center}
.stage{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#0b141a;position:relative;line-height:0}
.stage canvas{display:block;width:100%!important;height:auto!important;touch-action:pan-y;cursor:grab}
.stagehint{position:absolute;right:8px;bottom:6px;font-size:11px;line-height:1.4;color:var(--mute);pointer-events:none}
.msgs{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto;font-size:14px}
.msg{display:flex;gap:8px;align-items:baseline}
.msg .who{flex:none;font-size:12px;color:var(--mute);min-width:3.5em}
.msg.mine .who{color:var(--amber)}
.msg .tx{min-width:0;overflow-wrap:anywhere}
.msg.wh .tx{color:var(--gold)}
th{white-space:nowrap}
.un{background:var(--threat);color:#fff;border-radius:999px;padding:0 6px;font-size:11px;font-family:var(--mono)}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .15s}}

/* --- standalone additions --- */
html{-webkit-text-size-adjust:100%}
body{padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain;-webkit-tap-highlight-color:transparent}
input[type=text]{font-size:16px}
.btn{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stage canvas{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.stick{position:absolute;left:14px;bottom:14px;width:112px;height:112px;border-radius:50%;background:rgba(236,228,208,.12);border:2px solid rgba(236,228,208,.35);touch-action:none;-webkit-user-select:none;user-select:none}
.stick .knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--amber);opacity:.9;pointer-events:none}
.gbar{position:absolute;left:8px;right:8px;top:8px;display:flex;gap:8px;align-items:center;justify-content:space-between;background:rgba(15,26,34,.88);border:1px solid var(--amber);border-radius:4px;padding:6px 10px;line-height:1.4;font-weight:700;font-variant-numeric:tabular-nums}
.gbar[hidden]{display:none}
.stagetip{position:absolute;right:8px;bottom:6px;font-size:11px;line-height:1.4;color:var(--mute);pointer-events:none;text-align:right;max-width:55%}
.tk{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.ggrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
details.fake .row{margin-top:8px}
summary{padding-block:10px;touch-action:manipulation}
.dossier h4{margin:10px 0 2px;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--paper-mute)}
.dossier ol{margin:0;padding-left:20px;font-size:14px}
.dossier p{font-size:14px}
.dossier .sk{border-top:1px dashed rgba(27,33,38,.35);padding-top:6px;margin-top:4px;font-size:14px}
.dossier details{border-color:rgba(27,33,38,.4);background:rgba(255,255,255,.25)}
.dossier summary{color:var(--paper-ink)}
.dossier.shuffle{min-height:190px;align-items:center;justify-content:center;text-align:center}
.dossier.shuffle .role{font-size:40px}
.mini{position:absolute;right:8px;top:8px;width:96px;height:96px;background:rgba(15,26,34,.82);border:1px solid var(--line);border-radius:4px;pointer-events:none;line-height:0}
.mini[hidden],.ctx[hidden]{display:none}
.mini svg{width:100%;height:100%}
.mini rect{fill:#22323c;stroke:#3d5665;stroke-width:.25}
.mini rect.on{fill:#6b4d16}
.mini rect.co{fill:#18232b;stroke:none}
.mini rect.co.on{fill:#4a3712}
.mini text{font-size:3.2px;fill:#b9c6c9;text-anchor:middle;font-family:var(--body)}
.mini circle{fill:#e8a33d;stroke:#0f1a22;stroke-width:.3}
.gbar{right:112px}
.ctx{position:absolute;left:136px;right:8px;bottom:28px;display:flex;flex-direction:column;gap:6px;line-height:1.4}
.cx{background:rgba(15,26,34,.92);border:1px solid var(--amber);border-radius:4px;padding:6px 8px;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}
.cx.col{flex-direction:column;align-items:stretch}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.nums .btn{min-height:32px;padding:2px 0}
.note.armed{border-left-color:var(--threat);color:var(--bone);display:flex;flex-direction:column;gap:6px;margin-top:8px}
.lookrow{display:flex;gap:10px;align-items:flex-start}
.lookbig{width:96px;height:128px;flex:none;background:var(--panel2);border:1px solid var(--line);border-radius:4px}
.lookgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;flex:1;min-width:0}
.lookbtn{padding:0;background:var(--panel2);border:1px solid var(--line);border-radius:4px;cursor:pointer;aspect-ratio:3/4;overflow:hidden;touch-action:manipulation}
.lookbtn img{width:100%;height:100%;object-fit:cover;display:block}
.lookbtn.on{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.lookopts{margin-top:8px}
.lk{min-width:4.5em}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer;touch-action:manipulation}
.swatch.on{border-color:var(--bone);box-shadow:0 0 0 2px var(--amber)}
.pth{width:22px;height:30px;vertical-align:middle;margin-right:6px;border-radius:2px;background:var(--panel2)}
.pl .pn{display:flex;align-items:center;min-width:0}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--ink);border:1px solid var(--amber);border-radius:6px;padding:8px 12px;display:flex;flex-direction:column;gap:4px;box-shadow:0 6px 14px rgba(0,0,0,.45)}
.hudrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hudday{font-family:var(--display);font-weight:900;font-size:22px;line-height:1.1;color:var(--amber)}
.hudtime{flex:1;min-width:0;font-weight:700;font-variant-numeric:tabular-nums}
.hudtime .late{color:var(--threat)}
.hudbtns{gap:6px}
.hudbtns .btn{min-height:30px;padding:2px 8px;font-size:12px}
.hudcap{min-height:1.5em;font-size:13px;color:var(--gold);overflow-wrap:anywhere}
.hudcap:empty::before{content:"旁白字幕會顯示在這裡";color:var(--mute);opacity:.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:14}
.vbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.vbar .sub{flex:1;min-width:140px}
.pl.sp{border-color:#8fe3ff;box-shadow:inset 0 0 0 1px #8fe3ff}
details{padding-block:2px}
.share{font-family:var(--mono);font-size:13px;word-break:break-all;-webkit-user-select:all;user-select:all;color:var(--bone)}
/* --- playing: one landscape screen. The scene fills it; a slim top bar and a side drawer hold everything else. --- */
.stl{position:absolute;left:8px;right:112px;top:8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none;line-height:1.4}
.stl>*{pointer-events:auto}
.stl .gbar{position:static;align-self:stretch}
.stl .hudcap{background:rgba(15,26,34,.8);border-radius:4px;padding:3px 8px;font-size:13px;min-height:0;pointer-events:none;max-width:100%;box-sizing:border-box}
.stl .hudcap:empty{display:none}
.stl .armedx{border-color:var(--threat);max-width:100%;box-sizing:border-box}
.stl .cx{max-width:100%;box-sizing:border-box}
.cx.offer{border-color:var(--gold);gap:6px;max-width:min(100%,420px)}
.cx.offer .row{flex-wrap:nowrap}
.panel.after{border-color:var(--amber)}
body.game{padding:0;overflow:hidden;overscroll-behavior:none;position:fixed;inset:0;
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
body.game.rot{--sl:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-left,0px)}
body.game::before{display:none}
body.game #root{position:fixed;left:0;top:0;overflow:hidden;transform-origin:0 0;background:var(--ink)}
body.game #app{max-width:none;margin:0;display:block;position:absolute;inset:0}
body.game #toast{position:absolute;bottom:auto;top:calc(48px + var(--st));max-width:70%;z-index:30}
.gs{position:absolute;inset:0;display:flex;flex-direction:column;box-sizing:border-box;padding:var(--st) var(--sr) var(--sb) var(--sl)}
.gs-top{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.gs-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:12px;white-space:nowrap;overflow:hidden}
.gs-info .hudday{font-size:18px}
.gs-info .hudtime{flex:none;font-size:14px}
.gs-info .kv{font-size:12px;color:var(--mute)}
.gs-info .kv b{font-family:var(--mono);font-size:14px;color:var(--bone);font-variant-numeric:tabular-nums}
.gs-info .kv.late{color:var(--threat)}
.gs-tabs{flex:none;display:flex;gap:4px;align-items:center}
.gs-tabs .btn{min-height:32px;padding:2px 10px;font-size:13px;white-space:nowrap}
#vmini{display:flex}
.gs-main{flex:1;min-height:0;display:flex}
.gs-stage{flex:1;min-width:0;position:relative;background:#0b141a;overflow:hidden}
.gs-stage #stage-slot{position:absolute;inset:0;overflow:auto}
.gs-side{flex:none;width:min(46%,430px);box-sizing:border-box;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;border-left:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:10px}
.gs-side>*{flex:none}
.gs.wide .gs-side{width:56%}
.gs-side .panel{padding:10px}
.gs-side .plist{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.gs-side .dossier .role{font-size:26px}
.gs-side .msgs{max-height:none;min-height:60px}
.gs-side[data-tab=chat] .panel>h3{display:none}
.gs-side .inrow{order:-1}
body.game .stage{position:absolute;inset:0;border:0;border-radius:0}
body.game .stage canvas{width:100%!important;height:100%!important}
body.game .ctx{left:136px;right:8px;bottom:26px;align-items:flex-end;max-height:calc(100% - 136px);overflow-y:auto}
body.game .ctx .cx{width:100%;max-width:360px;box-sizing:border-box}
body.game .nums{grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
body.game .nums .btn{min-height:36px}
body.game .stick{left:calc(14px + 0px);bottom:14px}
.gs{container-type:inline-size}
@container (max-width:719px){.gs-info .kv.opt{display:none}}
@container (max-width:620px){.gs-tabs .btn{padding:2px 7px;font-size:12px}.gs-info{gap:8px}.gs-info .hudday{font-size:16px}.gs-info .hudtime{font-size:13px}.gs-side{width:50%}.gs.wide .gs-side{width:58%}}
</style>
</head>
<body>
<div id="root"><div id="app"></div>
<div id="toast" role="status" hidden></div></div>
<script src="three.min.js"></script>
<script src="engine.js"></script>
<script src="stage.js"></script>
<script src="voice.js"></script>
<script src="narrator.js"></script>
<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
